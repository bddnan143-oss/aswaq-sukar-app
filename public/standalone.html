    const INITIAL_USERS = [
      {

    /* =========================================================================
       LOCAL STORAGE ENGINE
       ========================================================================= */
    const storage = {
      get: (key, fallback) => {
        try {
          const item = localStorage.getItem('aswaq_standalone_' + key);
          return item ? JSON.parse(item) : fallback;
        } catch (e) {
          return fallback;
        }
      },
      set: (key, value) => {
        try {
          localStorage.setItem('aswaq_standalone_' + key, JSON.stringify(value));
        } catch (e) {}
      }
    };

    /* =========================================================================
       MAIN APP COMPONENT
       ========================================================================= */
    function App() {
      // Global State loaded from LocalStorage
      const [stores, setStores] = useState(() => storage.get('stores', INITIAL_STORES));
      const [products, setProducts] = useState(() => storage.get('products', INITIAL_PRODUCTS));
      const [orders, setOrders] = useState(() => storage.get('orders', []));
      const [debts, setDebts] = useState(() => storage.get('debts', []));
      const [users, setUsers] = useState(() => storage.get('users', INITIAL_USERS));
      const [currentUser, setCurrentUser] = useState(() => storage.get('currentUser', null));

      // Navigation & Modals
      const [currentView, setCurrentView] = useState('home'); // home | store | orders | owner | admin
      const [selectedStoreId, setSelectedStoreId] = useState(null);
      const [cart, setCart] = useState(() => storage.get('cart', []));
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // login | register_owner | register_customer
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('الكل');

      // Sync state back to LocalStorage
      useEffect(() => { storage.set('stores', stores); }, [stores]);
      useEffect(() => { storage.set('products', products); }, [products]);
      useEffect(() => { storage.set('orders', orders); }, [orders]);
      useEffect(() => { storage.set('debts', debts); }, [debts]);
      useEffect(() => { storage.set('users', users); }, [users]);
      useEffect(() => { storage.set('currentUser', currentUser); }, [currentUser]);
      useEffect(() => { storage.set('cart', cart); }, [cart]);

      // Cart Helpers
      const cartTotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
      }, [cart]);

      const cartItemCount = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.quantity, 0);
      }, [cart]);

      const addToCart = (product) => {
        setCart(prev => {
          // Verify same store
          if (prev.length > 0 && prev[0].product.storeId !== product.storeId) {
            if (!confirm('سلتك تحتوي على منتجات من متجر آخر. هل تود إفراغ السلة وبدء طلب جديد من هذا المتجر؟')) {
              return prev;
            }
            return [{ product, quantity: 1 }];
          }
          const existing = prev.find(item => item.product.id === product.id);
          if (existing) {
            return prev.map(item => item.product.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { product, quantity: 1 }];
        });
      };

      const updateCartQuantity = (productId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.product.id === productId) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      // Checkout Handler
      const handleCheckout = (formData) => {
        if (cart.length === 0) return;
        const currentStore = stores.find(s => s.id === cart[0].product.storeId);
        const newOrder = {
          id: 'ord_' + Date.now(),
          storeId: cart[0].product.storeId,
          storeName: currentStore ? currentStore.name : 'متجر',
          customerName: formData.name,
          customerPhone: formData.phone,
          customerAddress: formData.address,
          notes: formData.notes || '',
          items: cart.map(i => ({
            productId: i.product.id,
            name: i.product.name,
            price: i.product.price,
            quantity: i.quantity
          })),
          totalAmount: cartTotal,
          deliveryFee: currentStore ? (currentStore.deliveryFee || 0) : 0,
          status: 'pending',
          createdAt: new Date().toISOString()
        };

        setOrders(prev => [newOrder, ...prev]);
        setCart([]);
        setIsCartOpen(false);
        alert('تم إرسال طلبك بنجاح! رقم الطلب: #' + newOrder.id.slice(-6));
        setCurrentView('orders');
      };

      // Direct Standalone Download Handler
      const handleDownloadHTML = () => {
        const fullHtml = document.documentElement.outerHTML;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const selectedStore = useMemo(() => {
        return stores.find(s => s.id === selectedStoreId);
      }, [stores, selectedStoreId]);

      const storeProducts = useMemo(() => {
        if (!selectedStoreId) return [];
        return products.filter(p => p.storeId === selectedStoreId);
      }, [products, selectedStoreId]);

      const filteredStores = useMemo(() => {
        return stores.filter(s => {
          const matchCat = selectedCategory === 'الكل' || s.category === selectedCategory;
          const matchQuery = !searchQuery || s.name.includes(searchQuery) || s.description.includes(searchQuery);
          return matchCat && matchQuery;
        });
      }, [stores, selectedCategory, searchQuery]);

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-100/70">

                >

          </header>

          {/* Main Content Area */}
          <main className="max-w-6xl mx-auto px-4 py-6 w-full flex-1">
            {/* VIEW: HOME */}
            {currentView === 'home' && (
              <div className="space-y-6">

                <div className="bg-gradient-to-br from-emerald-600 to-teal-800 rounded-3xl p-6 text-white shadow-md relative overflow-hidden">

                    <h2 className="text-2xl font-black mb-1">سوق قلعة سكر بين يديك</h2>
                    <p className="text-xs text-emerald-100 leading-relaxed mb-4">
                      استعرض كل متاجر وأسواق قلعة سكر، قارن الأسعار، واطلب كل احتياجاتك لتصل لباب بيتك فوراً.
                    </p>
                    <div className="relative">
                      <input

                      <svg className="w-5 h-5 absolute right-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                  </div>
                </div>

                {/* Categories */}
                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                  {['الكل', 'مواد غذائية وماركت', 'إلكترونيات وموبايل', 'لحوم وقصابة', 'صيدلية وعناية', 'حلويات ومعجنات'].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`whitespace-nowrap px-4 py-2 rounded-2xl text-xs font-black transition ${
                        selectedCategory === cat
                          ? 'bg-emerald-600 text-white shadow-sm'
                          : 'bg-white text-slate-700 hover:bg-slate-200/80 border border-slate-200/80'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                {/* Stores Grid */}
                <div>
                  <h3 className="text-base font-black text-slate-900 mb-3 flex items-center justify-between">
                    <span>متاجر قلعة سكر المتاحة ({filteredStores.length})</span>
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredStores.map(store => (
                      <div
                        key={store.id}
                        onClick={() => { setSelectedStoreId(store.id); setCurrentView('store'); }}
                        className="bg-white rounded-2xl p-4 border border-slate-200/80 hover:border-emerald-500/80 transition-all hover:shadow-md cursor-pointer flex flex-col justify-between"
                      >
                        <div>
                          <div className="h-36 w-full rounded-xl overflow-hidden mb-3 bg-slate-100 relative">
                            <img src={store.imageUrl} alt={store.name} className="w-full h-full object-cover" />
                            <span className="absolute top-2 right-2 bg-emerald-600/90 backdrop-blur-xs text-white text-[10px] font-black px-2 py-0.5 rounded-md">
                              {store.category}
                            </span>
                          </div>

                          <p className="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-3">{store.description}</p>
                        </div>
                        <div className="pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-slate-600">
                          <span className="text-emerald-700">توصيل: {store.deliveryFee} د.ع</span>
                          <span className="bg-emerald-50 text-emerald-800 px-2.5 py-1 rounded-xl text-[11px] font-black">

                          </span>

                  <div className="flex-1 text-right w-full">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="bg-emerald-100 text-emerald-900 text-[10px] font-black px-2 py-0.5 rounded-md">
                        {selectedStore.category}
                      </span>
                      <span className="text-xs font-bold text-emerald-700">★ {selectedStore.rating}</span>
                    </div>
                    <h2 className="text-xl font-black text-slate-900 mb-1">{selectedStore.name}</h2>
                    <p className="text-xs text-slate-600 mb-3">{selectedStore.description}</p>
                    <p className="text-xs text-slate-500 font-medium">📍 {selectedStore.address}</p>
                  </div>
                </div>

                {/* Products Section */}
                <div>
                  <h3 className="text-base font-black text-slate-900 mb-3">منتجات وقائمة المتجر ({storeProducts.length})</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                    {storeProducts.map(prod => (
                      <div key={prod.id} className="bg-white rounded-2xl p-3 border border-slate-200/80 flex flex-col justify-between">
                        <div>
                          <img src={prod.imageUrl} alt={prod.name} className="w-full h-28 object-cover rounded-xl mb-2" />
                          <h5 className="text-xs font-black text-slate-900 line-clamp-2 leading-tight mb-1">{prod.name}</h5>
                          <p className="text-xs font-black text-emerald-700">{prod.price.toLocaleString()} د.ع</p>
                        </div>
                        <button
                          onClick={() => addToCart(prod)}
                          className="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs py-2 rounded-xl transition active:scale-95"
                        >
                          + إضافة للسلة
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: ORDERS */}
            {currentView === 'orders' && (
              <div className="space-y-4 max-w-2xl mx-auto">
                <h3 className="text-lg font-black text-slate-900">سجل طلباتي</h3>
                {orders.length === 0 ? (
                  <div className="bg-white rounded-2xl p-8 text-center text-slate-500 text-xs font-bold border border-slate-200">
                    لا توجد لديك طلبات سابقة حتى الآن.
                  </div>
                ) : (
                  orders.map(ord => (
                    <div key={ord.id} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs">
                      <div className="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                        <div>
                          <strong className="text-xs font-black text-slate-900">{ord.storeName}</strong>
                          <span className="text-[10px] text-slate-400 block">{new Date(ord.createdAt).toLocaleDateString('ar-IQ')}</span>
                        </div>
                        <span className="text-[11px] font-black bg-amber-100 text-amber-900 px-2 py-0.5 rounded-lg">
                          {ord.status === 'pending' ? 'قيد المعالجة' : 'مكتمل'}
                        </span>
                      </div>
                      <div className="space-y-1 mb-3">
                        {ord.items.map((it, idx) => (
                          <div key={idx} className="flex justify-between text-xs text-slate-700">
                            <span>{it.name} × {it.quantity}</span>
                            <span>{(it.price * it.quantity).toLocaleString()} د.ع</span>
                          </div>
                        ))}
                      </div>
                      <div className="pt-2 border-t border-slate-100 flex justify-between items-center text-xs font-black text-slate-900">
                        <span>المجموع الكلي مع التوصيل:</span>
                        <span className="text-emerald-700 text-sm">{(ord.totalAmount + ord.deliveryFee).toLocaleString()} د.ع</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-slate-600 text-xs">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div>
                <strong className="text-slate-900">أسواق قلعة سكر</strong> - المنصة الموحدة لأهالي ومتاجر المدينة.
              </div>
              <div className="flex items-center gap-3">
                <button
                  onClick={handleDownloadHTML}
                  className="rounded-xl border border-emerald-300 bg-emerald-50 px-3 py-1.5 text-xs font-black text-emerald-900 hover:bg-emerald-100 transition"
                >
                  💾 تنزيل هذا الكود المدمج (index.html)
                </button>
              </div>
            </div>
          </footer>

          {/* CART MODAL / DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex justify-end">
              <div className="bg-white w-full max-w-md h-full flex flex-col justify-between p-5 shadow-2xl overflow-y-auto">
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                    <h3 className="text-base font-black text-slate-900">سلة التسوق ({cartItemCount})</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-slate-400 hover:text-slate-700 text-lg font-black">✕</button>
                  </div>

                  {cart.length === 0 ? (
                    <p className="text-xs text-slate-500 text-center py-10">السلة فارغة حالياً.</p>
                  ) : (
                    <div className="space-y-3">
                      {cart.map(item => (
                        <div key={item.product.id} className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl">
                          <div>
                            <h5 className="text-xs font-bold text-slate-900">{item.product.name}</h5>
                            <span className="text-[11px] text-emerald-700 font-black">{item.product.price.toLocaleString()} د.ع</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateCartQuantity(item.product.id, -1)} className="w-6 h-6 bg-slate-200 rounded text-xs font-bold">-</button>
                            <span className="text-xs font-bold">{item.quantity}</span>
                            <button onClick={() => updateCartQuantity(item.product.id, 1)} className="w-6 h-6 bg-emerald-600 text-white rounded text-xs font-bold">+</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleCheckout({
                      name: form.cust_name.value,
                      phone: form.cust_phone.value,
                      address: form.cust_address.value,
                      notes: form.cust_notes.value
                    });
                  }} className="space-y-3 pt-4 border-t border-slate-100">
                    <div className="flex justify-between font-black text-sm text-slate-900">
                      <span>إجمالي المنتجات:</span>
                      <span className="text-emerald-700">{cartTotal.toLocaleString()} د.ع</span>
                    </div>

                    <input required name="cust_name" type="text" placeholder="الاسم الكامل" className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50" />
                    <input required name="cust_phone" type="tel" placeholder="رقم الهاتف (واتساب)" className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50" />
                    <input required name="cust_address" type="text" placeholder="العنوان في قلعة سكر (الحي / أقرب نقطة دالة)" className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50" />
                    <textarea name="cust_notes" rows="2" placeholder="ملاحظات إضافية للطلب (اختياري)" className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50"></textarea>

                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-black text-xs shadow-md transition active:scale-95">
                      تأكيد وإرسال الطلب الآن
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* AUTH MODAL */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-base font-black text-slate-900">تسجيل الدخول السريع</h3>
                  <button onClick={() => setIsAuthModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const email = e.target.email.value;
                  const found = users.find(u => u.email === email) || {
                    id: 'usr_' + Date.now(),
                    name: email.split('@')[0],
                    email: email,
                    role: 'customer'
                  };
                  setCurrentUser(found);
                  setIsAuthModalOpen(false);
                }} className="space-y-3">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
                    <input required name="email" type="email" placeholder="example@aswaq.iq" className="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50" />
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-black text-xs transition">
                    متابعة
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount application to root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
